<!DOCTYPE html>
<html>
<head>
<title>GN-Math + AI</title>

<style>
body {
    margin:0;
    background:#111;
}

#ai {
    position:fixed;
    right:20px;
    bottom:20px;
    width:350px;
    height:500px;
    background:#1e293b;
    border-radius:15px;
    color:white;
    z-index:9999;
    padding:15px;
}

iframe {
    width:100%;
    height:100vh;
    border:0;
}

#chat {
    height:350px;
    overflow:auto;
}

input {
    width:70%;
    padding:8px;
}

button {
    padding:8px;
}
</style>

</head>

<body>

<!-- Your original GN-Math -->
<iframe src="gn-math.html"></iframe>


<!-- AI popup -->
<div id="ai">

<h2>🤖 GN-Math AI</h2>

<div id="chat">
AI: Hello!
</div>

<input id="msg" placeholder="Ask me">
<button onclick="send()">Send</button>

</div>


<script>

async function send(){

let msg=document.getElementById("msg");
let chat=document.getElementById("chat");

let text=msg.value;

chat.innerHTML += "<br>You: "+text;

msg.value="";


let res = await fetch("/api/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});


let data=await res.json();


chat.innerHTML += "<br>AI: "+data.reply;

}


</script>

</body>
</html>
